; The web pool: page loads and ajax. Milliseconds per request, CPU- and
; DB-bound, bursty.
;
; Drains (/queue, /cron) are routed away to the background pool precisely so a
; 900-second agent turn can never occupy one of these children.
;
; Exactly one pool file is installed at boot, by `entry.sh`, from
; `pools-available/` -- the `sites-available` idiom -- so a
; `docker exec <container> ls /etc/php/8.5/fpm/pool.d/` says which role the
; container is running.

[global]
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; `static` because max_children is then the only knob, and a fixed count makes
; the memory ceiling knowable (children x memory_limit). `dynamic` also needs
; start_servers and the spare-server settings, and FPM refuses to start when
; those contradict max_children.
pm = static
pm.max_children = ${CERB_WEB_CHILDREN}
pm.max_requests = 500

; `request_terminate_timeout` is deliberately unset. Unset means FPM never
; kills a request of its own accord, which /update depends on: it runs
; @set_time_limit(3600) and legitimately outlives the browser.

access.log = /dev/null
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php

php_flag[display_errors] = off
php_admin_value[post_max_size] = 64M
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
