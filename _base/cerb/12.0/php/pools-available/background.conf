; The background pool: drains only (/queue, /cron). One request can hold a
; child for the length of an LLM agent turn -- up to 900s -- so these children
; are kept away from the web pool, where that would be a stall.
;
; Children here are sized on memory and DB connections, not cores: a drain
; worker is a blocking curl_exec burning ~0 CPU and ~50MB RAM while it waits,
; plus one MySQL connection for the whole drain. Scale out with
; `docker compose up --scale php-fpm-background=3`.
;
; Exactly one pool file is installed at boot, by `entry.sh`, from
; `pools-available/` -- the `sites-available` idiom -- so a
; `docker exec <container> ls /etc/php/8.5/fpm/pool.d/` says which role the
; container is running.

[global]
error_log = /proc/self/fd/2

[background]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; One turnover deep, on purpose. At the 511 default a saturated pool queues
; silently and a request can sit for minutes before answering 200, which reads
; as "slow" rather than "full". A shallow backlog makes a full pool refuse
; fast, which is what the web server's 529 translation depends on.
listen.backlog = ${CERB_BACKGROUND_CHILDREN}

; `static` because max_children is then the only knob, and a fixed count makes
; the memory ceiling knowable (children x memory_limit). `dynamic` also needs
; start_servers and the spare-server settings, and FPM refuses to start when
; those contradict max_children.
pm = static
pm.max_children = ${CERB_BACKGROUND_CHILDREN}
pm.max_requests = 200

; Never terminate a drain. A terminate is a SIGTERM: ignore_user_abort()
; cannot survive it and it skips DevblocksPlatform::shutdown() entirely, so
; queue()->publish(), metrics()->publish() and registry()->save() never flush
; and acks are LOST.
request_terminate_timeout = 0

access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{milli}d %{kilo}M %C%%"
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php

php_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 64M
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
