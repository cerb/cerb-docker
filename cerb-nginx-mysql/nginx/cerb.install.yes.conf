location /install/ {
    location = /install/ {
        rewrite ^ /install/index.php last;
    }

    # Route PHP requests to FPM.
    #
    # Pinned to the web pool literally, not to $cerb_fpm_backend: the installer
    # is never a drain, and this file is a plain include rather than a
    # template, so it is not run through envsubst.
    location ~ ^/install/(index|servercheck|phpinfo)\.php$ {
        root /var/www/html;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   php-fpm:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;

        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout    900s;
    }
}
